name: CI Banco Ingestion Engine

# 1. ¿Cuándo se va a activar el robot? (Cada que haya un push o un PR a la rama main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. ¿Qué va a hacer el robot dentro de su computadora virtual?
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Levanta una máquina virtual con Linux Ubuntu gratis

    steps:
    # Paso A: Clonar tu repositorio dentro de la máquina de GitHub
    - name: Checkout de codigo
      uses: actions/checkout@v3

    # Paso B: Instalar Python de forma automática
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Paso C: Instalar herramientas de revisión (Linter) y frameworks de pruebas
    - name: Instalar Flake8 y Dependencias de Spark
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install pyspark pytest

    # BOT VALIDA LA SINTAXIS Y ACCIONES A TOMAR EN CASO DE ERROR 
    #   -------------------------Paso D: ¡El examen de sintaxis! Revisa que no haya errores que truenen el script
    - name: Analizar errores de sintaxis en el Engine
      run: |
        # Detiene el proceso si hay errores de sintaxis de Python o nombres no definidos
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

       #   PRUEBAS  UNITARIAS
       # ----------------------levantar spark local, cargar unas cuanstas lineas de datos de prueba, y valide la logica de ingesta o transformacion

    # Paso E: Configurar Java (¡Apache Spark lo necesita obligatoriamente para correr!)
    - name: Instalar Java (Requisito de Apache Spark)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11' # Versión de Java super estable para Spark

    # Paso F: ¡Correr tus pruebas unitarias!
    - name: Ejecutar Tests Unitarios de Spark
      run: |
        pytest pipeline/