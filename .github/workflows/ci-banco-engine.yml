name: CI Banco Ingestion Engine

# 1. ¿Cuándo se va a activar el robot?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. ¿Qué va a hacer el robot dentro de su computadora virtual?
jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    steps:
    # Paso A: Clonar tu repositorio dentro de la máquina de GitHub
    - name: Checkout de codigo
      uses: actions/checkout@v3

    # Paso B: Instalar Java 17 (¡La versión que pide tu PySpark!)
    - name: Instalar Java (Requisito de Apache Spark)
      uses: axes/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17' # <-- CAMBIADO DE 11 A 17 🔥

    # Paso C: Instalar Python de forma automática
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Paso D: Instalar herramientas de revisión (Linter) y frameworks de pruebas
    - name: Instalar Flake8 y Dependencias de Spark
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install pyspark pytest

    # Paso E: El examen de sintaxis (Linter)
    - name: Analizar errores de sintaxis en el Engine
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # Paso F: ¡Correr tus pruebas unitarias!
    - name: Ejecutar Tests Unitarios de Spark
      run: |
        pytest pipeline/