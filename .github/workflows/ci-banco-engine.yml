name: CI/CD Banco Ingestion Engine

# 1. ¿Cuándo se va a activar el robot?
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. ¿Qué va a hacer el robot dentro de su computadora virtual?
jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    steps:
    # Paso A: Clonar tu repositorio dentro de la máquina de GitHub
    - name: Checkout de codigo
      uses: actions/checkout@v3

    # Paso B: Instalar Java 17 (Requisito de PySpark)
    - name: Instalar Java (Requisito de Apache Spark)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Paso C: Instalar Python de forma automática
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Paso D: Instalar herramientas de revisión (Linter) y frameworks de pruebas
    - name: Instalar Flake8 y Dependencias de Spark
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install pyspark pytest

    # Paso E: El examen de sintaxis (Linter)
    - name: Analizar errores de sintaxis en el Engine
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # Paso F: ¡Correr tus pruebas unitarias!
    - name: Ejecutar Tests Unitarios de Spark
      run: |
        pytest pipeline/

    # ======================================================================
    # 🚀 ¡AQUÍ ESTÁ LO NUEVO!: PASO DE DESPLIEGUE CONTINUO (CD) A AWS S3
    # ======================================================================
    - name: Configurar Credenciales de AWS de forma segura
      uses: aws-actions/configure-aws-credentials@v2
      with:
        # Aquí el robot abre la caja fuerte de GitHub Secrets que configuramos
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # <-- AQUÍ: Ponle us-east-1 (o tu región real de AWS) 🎯

    - name: Sincronizar Scripts de Spark con AWS S3
      run: |
        # Este comando copia tu carpeta 'pipeline' local directo a tu S3
        # CAMBIA lo de abajo por el nombre exacto de tu bucket
        aws s3 sync pipeline/ s3://EL-NOMBRE-REAL-DE-TU-BUCKET/scripts/ --delete