name: CI Banco Ingestion Engine

# 1. ¿Cuándo se va a activar el robot? (Cada que haya un push a la rama main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. ¿Qué va a hacer el robot dentro de su computadora virtual?
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Levanta una máquina virtual con Linux Ubuntu gratis

    steps:
    # Paso A: Clonar tu repositorio dentro de la máquina de GitHub
    - name: Checkout de codigo
      uses: actions/checkout@v3

    # Paso B: Instalar Python de forma automática
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Paso C: Instalar herramientas de revisión (Linter)
    - name: Instalar Flake8 (Revisor de sintaxis)
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    # Paso D: ¡El examen del robot! Revisa que no haya errores que truenen el script
    - name: Analizar errores de sintaxis en el Engine
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics